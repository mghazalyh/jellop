name: Jellop RPCS3
on:
  push:
    branches: [main, 'engineering/runtime-controls', 'engineering/visual-render-gate-20261127']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: jellop-rpcs3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish exact run URL for acceptance tracking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=jellop/visual-acceptance -f description='RPCS3 visual acceptance running' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  emulator-package:
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python smoke harness before compilation
        run: |
          python3 -m compileall -q tools
          python3 tools/test_surf_acceptance.py
      - name: Fetch pinned SDK
        run: |
          curl --fail --location --retry 2 --max-time 180 -o tools/ps3dev-linux-X64.tar.gz https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz
          echo 'dcbed747e094c6a382dae5b0aacc322a1d4390d9f2849a7d750a96ea398ee8ab  tools/ps3dev-linux-X64.tar.gz' | sha256sum -c -
          docker build -f tools/Dockerfile.ps3 -t jellop-build:2026-07-26 tools
      - name: Cross-compile separate emulator package
        run: |
          docker run --rm -v "$PWD:/build" jellop-build:2026-07-26 make -j2 BUILD_FOR_RPCS3=1 pkg
          docker run --rm -v "$PWD:/build:ro" jellop-build:2026-07-26 python3 tools/verify_pkg.py
          mkdir -p dist
          cp JellyFin-PS3.gnpdrm.pkg dist/Jellop-RPCS3.pkg
          (cd dist && sha256sum Jellop-RPCS3.pkg > Jellop-RPCS3.pkg.sha256)
          git rev-parse HEAD > dist/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jellop-RPCS3-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
  emulator-smoke:
    needs: emulator-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated emulator profile
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/jellop-rpcs3/config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/jellop-rpcs3/cache" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/jellop-rpcs3/data" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Jellop-RPCS3-candidate
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install graphical runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libasound2t64 libpulse0 libpipewire-0.3-0t64 ffmpeg imagemagick
      - name: Download pinned RPCS3 and official firmware
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --max-time 180 -o rpcs3.AppImage https://github.com/RPCS3/rpcs3-binaries-linux/releases/download/build-0ca5eb0efe50ec4e8aa07892ab86d57842246eb4/rpcs3-v0.0.43-20663-0ca5eb0e_linux64.AppImage
          echo 'efba6a20ab8d33edec07c68f46e1f22c43ba95e2bf301c4489bcd6f4c4359bf1  rpcs3.AppImage' | sha256sum -c -
          chmod +x rpcs3.AppImage
          ./rpcs3.AppImage --appimage-extract > /dev/null
          # Sony's support link uses HTTP on this legacy CDN. Verify the
          # exact pinned OFW 4.93 SHA-256 before any installation.
          curl --fail --location --retry 2 --max-time 180 --proto '=http,https' --proto-redir '=http,https' -o PS3UPDAT.PUP http://dus01.ps3.update.playstation.net/update/ps3/image/us/2026_0318_a2b60b6ac1d2e49e230144345616927c/PS3UPDAT.PUP
          echo '158471fd834f8ea8036136b6aab43cd86c7ba73d79ca30e0af3c0fe0001cf365  PS3UPDAT.PUP' | sha256sum -c -
          test "$(stat -c %s PS3UPDAT.PUP)" = 206197916
      - name: Install firmware and candidate in isolated RPCS3 profile
        run: |
          mkdir -p "$XDG_CONFIG_HOME/rpcs3" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" smoke
          printf 'Video:\n  Renderer: "Null"\nAudio:\n  Renderer: "Null"\n  Music Handler: "Null"\n' > "$XDG_CONFIG_HOME/rpcs3/config.yml"
          set -o pipefail
          timeout 30 "$RUNNER_TEMP/squashfs-root/AppRun" --headless --version 2>&1 | tee smoke/version.log
          # RPCS3's headless installer can abort on teardown (fixed_typemap).
          # Only tolerate that specific exit if RPCS3 logged successful
          # installation and the required on-disk postconditions are met.
          run_install() {
            local mode="$1" input="$2" success="$3" rc=0
            timeout 420 "$RUNNER_TEMP/squashfs-root/AppRun" --headless "$mode" "$input" > "smoke/$mode.stdout.log" 2>&1 || rc=$?
            cat "smoke/$mode.stdout.log"
            local log="$XDG_CACHE_HOME/rpcs3/RPCS3.log"
            touch "smoke/$mode.rpcs3.log" "smoke/$mode.rpcs3.previous.log"
            if test -f "$log"; then cp "$log" "smoke/$mode.rpcs3.log"; fi
            if test -f "$log.gz"; then gzip -cd "$log.gz" > "smoke/$mode.rpcs3.previous.log" || true; fi
            if ! grep -aE "$success" "smoke/$mode.stdout.log" "smoke/$mode.rpcs3.log" "smoke/$mode.rpcs3.previous.log" 2>/dev/null; then
              echo "Installer did not record expected success: $mode"
              tail -n 60 "smoke/$mode.rpcs3.log" 2>/dev/null || true
              return 1
            fi
            if test "$rc" != 0; then
              test "$rc" = 134 && grep -F 'manual_typemap' "smoke/$mode.stdout.log" || return "$rc"
              echo "::warning::RPCS3 aborted on teardown after confirmed installer success"
            fi
          }
          run_install --installfw "$RUNNER_TEMP/PS3UPDAT.PUP" 'Successfully installed PS3 firmware version 4.93'
          test -s "$XDG_CONFIG_HOME/rpcs3/dev_flash/vsh/module/vsh.self"
          test -s "$XDG_CONFIG_HOME/rpcs3/dev_flash/sys/external/liblv2.sprx"
          run_install --installpkg "$PWD/dist/Jellop-RPCS3.pkg" 'Successfully installed .*title_id=JELP30001'
          game="$XDG_CONFIG_HOME/rpcs3/dev_hdd0/game/JELP30001"
          test -s "$game/USRDIR/EBOOT.BIN"
          test -s "$game/PARAM.SFO"
          python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); assert (p/"USRDIR/EBOOT.BIN").read_bytes()[:4] == b"SCE\0"; assert b"JELP30001" in (p/"PARAM.SFO").read_bytes()' "$game"
      - name: Actual graphical playback and repeated Surf cycles from deployed media
        env:
          JELLOP_PUBLIC_FIXTURE: '1'
        run: |
          # Use the runner's own private IPv4 rather than guest loopback.
          # The fixture exists only in this ephemeral GitHub runner.
          export JELLOP_FIXTURE_HOST="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++)if($i=="src"){print $(i+1);exit}}')"
          test -n "$JELLOP_FIXTURE_HOST"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/rpcs3_smoke.py --emulator "$RUNNER_TEMP/squashfs-root/AppRun" --root "$XDG_CONFIG_HOME/rpcs3" --output smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jellop-RPCS3-smoke-diagnostics
          path: smoke/
          if-no-files-found: warn
          retention-days: 7
  report:
    if: always()
    needs: [announce, emulator-package, emulator-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish visual acceptance outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RESULT: ${{ needs.emulator-package.result }}
          SMOKE_RESULT: ${{ needs.emulator-smoke.result }}
        run: |
          state=failure
          if test "$PACKAGE_RESULT" = success && test "$SMOKE_RESULT" = success; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=jellop/visual-acceptance -f description="Package: $PACKAGE_RESULT; visual: $SMOKE_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
